enabled: false

# publicUrl: Zammad base URL for the chat widget script src.
# If not set, auto-detected from the ssa-zammad OpenShift Route via Helm lookup.
publicUrl: ""
chatId: 1  # Zammad chat channel ID (Admin → Channels → Chat)

# Split-screen demo portal (index.html): hero + credentials + Zammad iframe (chat-embed.html for widget snippet).
demoPortal:
  productName: "IT Self-Service"
  heroTitle: "Sign in to Zammad"
  heroSubtitle: "Use the demo accounts below with the live Zammad UI."

image: nginxinc/nginx-unprivileged:alpine
