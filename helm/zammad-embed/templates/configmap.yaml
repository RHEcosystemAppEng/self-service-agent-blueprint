{{- if .Values.enabled }}
{{- $zammadUrl := .Values.publicUrl | default "" | trimSuffix "/" }}
{{- if not $zammadUrl }}
{{-   $route := lookup "route.openshift.io/v1" "Route" .Release.Namespace "ssa-zammad" }}
{{-   if $route }}
{{-     $zammadUrl = printf "https://%s" $route.spec.host }}
{{-   else }}
{{-     $zammadUrl = "https://YOUR-ZAMMAD-URL" }}
{{-   end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: zammad-embed
data:
  index.html: |
{{ include "zammad-embed.demoPortalIndex" (dict "zammadUrl" $zammadUrl "Values" .Values "Release" .Release) | nindent 4 }}
  chat-embed.html: |
{{ include "zammad-embed.chatEmbedPage" (dict "zammadUrl" $zammadUrl "Values" .Values) | nindent 4 }}
{{- end }}
