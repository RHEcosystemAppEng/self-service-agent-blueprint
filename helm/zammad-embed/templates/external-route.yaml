{{- if .Values.enabled }}
{{- $host := include "zammad-embed.zammadHost" . | trim }}
{{- if not $host }}
{{- fail "zammad-embed: no host for Route (lookup ssa-zammad failed). Set zammadRouteHost in values, or install after the Zammad Route exists." }}
{{- end }}
{{- $pp := include "zammad-embed.normalizePathPrefix" .Values.pathPrefix }}
---
# Same host as ssa-zammad; path routes to embed nginx (same origin as Zammad UI).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ssa-zammad-embed
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: zammad-embed
spec:
  host: {{ $host | quote }}
  path: {{ $pp | quote }}
  to:
    kind: Service
    name: {{ .Release.Name }}
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
