{{- if .Values.externalRoute.enabled }}
---
# OpenShift Route for Zammad Web UI
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ssa-zammad
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: zammad
  annotations:
    haproxy.router.openshift.io/timeout: "300s"
spec:
  # Explicit / so a sibling Route (ssa-zammad-embed) can claim a more specific path on the same host.
  path: /
  to:
    kind: Service
    name: {{ default .Release.Name .Values.zammad.fullnameOverride }}-nginx
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
