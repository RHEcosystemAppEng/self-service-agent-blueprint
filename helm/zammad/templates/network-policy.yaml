{{- $edgeEnabled := .Values.edgeProxy.disableAttachments }}
{{- if .Values.externalRoute.enabled }}
---
# Allow ingress from OpenShift router to Zammad edge proxy or nginx (ssa-zammad Route).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-zammad-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: zammad
spec:
  podSelector:
    matchLabels:
      {{- if $edgeEnabled }}
      app.kubernetes.io/component: zammad-edge
      {{- else }}
      app.kubernetes.io/name: zammad
      app.kubernetes.io/component: zammad-nginx
      {{- end }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          network.openshift.io/policy-group: ingress
    ports:
    - protocol: TCP
      port: 8080
{{- end }}
{{- if $edgeEnabled }}
---
# Edge proxy → zammad-nginx (HTML, assets, API pass-through).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-zammad-edge-to-nginx
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: zammad
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zammad
      app.kubernetes.io/component: zammad-nginx
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: zammad-edge
    ports:
    - protocol: TCP
      port: 8080
---
# Edge proxy → zammad-websocket (direct /ws WebSocket, avoids double-hop).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-zammad-edge-to-websocket
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: zammad
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zammad
      app.kubernetes.io/component: zammad-websocket
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: zammad-edge
    ports:
    - protocol: TCP
      port: 6042
---
# Edge proxy → zammad-railsserver (direct /cable ActionCable, avoids double-hop).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-zammad-edge-to-railsserver
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: zammad
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zammad
      app.kubernetes.io/component: zammad-railsserver
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: zammad-edge
    ports:
    - protocol: TCP
      port: 3000
{{- if .Values.edgeProxy.demoSiteProxy.enabled }}
---
# Edge proxy → demo site (reverse-proxy for same-origin port-forward access).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-zammad-edge-to-demo-site
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: zammad
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: zammad-demo-site
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: zammad-edge
    ports:
    - protocol: TCP
      port: 8080
{{- end }}
{{- end }}
