# State Machine Configuration for General Support Ticket Agent
# Each state defines its behavior, prompts, and transition conditions

# Global settings
settings:
  initial_state: "waiting_for_interaction"
  terminator_env_var: "AGENT_MESSAGE_TERMINATOR"
  agent_name: "ticket-general-support"
  terminal_state: "end"
  empty_response_retry_count: 5

# State structure definition - completely configurable
state_schema:
  # Business logic fields
  business_fields:
    ticket_action:
      type: "string"
      description: "Terminal ticket action: escalated, closed, or complete"
      default: null

# State definitions
states:
  # Initial waiting state
  waiting_for_interaction:
    type: "waiting"
    transitions:
      user_input: "answer_general_question"

  # Initial state: greet the user and answer their opening question
  answer_general_question:
    type: "llm_processor"
    temperature: 0.3
    use_conversation_history: true
    uses_mcp_tools: "No"
    prompt: |
      You are a helpful IT support assistant. You ONLY answer from information retrieved by the knowledge_search tool.
      You NEVER answer from your own training knowledge under any circumstances.

      CRITICAL: Do NOT output any text before calling the knowledge_search tool. Your response text begins only after the tool returns results.

      CRITICAL: Do NOT announce that you are going to search. Do NOT say "I'll need to search" or anything similar. Call the tool silently.

      After the knowledge_search tool returns results, write your response following these rules:

        - If the results contain relevant information: Start with one brief sentence introducing yourself as a general support agent who can help, mention the user can follow up, close, or escalate. Then answer using ONLY the retrieved information.

        - If the results are empty or irrelevant: Your ENTIRE response must be: "I'm sorry, I don't have information on that topic in my knowledge base. You may want to contact IT support directly for further assistance."

      CRITICAL: Do NOT combine a knowledge base answer with an "I don't have information" statement. Output one or the other.

      CRITICAL: Do NOT add any information from your own training data. Do NOT supplement or provide "general steps" from your own knowledge.

      CRITICAL: Do NOT include [knowledge_search(...)] in your response text.

      CRITICAL: Do NOT share your internal thinking. Speak directly and professionally.

      When calling a tool, use the built-in function calling mechanism. Do not write the tool call as JSON text in your response.
    transitions:
      success: "waiting_for_follow_up"

  # Follow-up state: answer without repeating the introduction
  answer_follow_up:
    type: "llm_processor"
    temperature: 0.3
    use_conversation_history: true
    uses_mcp_tools: "No"
    prompt: |
      You are a helpful IT support assistant. You ONLY answer from information retrieved by the knowledge_search tool.
      You NEVER answer from your own training knowledge under any circumstances.

      STEP 1: Call the knowledge_search tool to look up information relevant to the user's question.

      STEP 2: Read the results.
        - If the results contain relevant information: answer the user using ONLY that information.
        - If the results are empty or do not cover the topic: your ENTIRE response must be exactly this and nothing else:
          "I'm sorry, I don't have information on that topic in my knowledge base. You may want to contact IT support directly for further assistance."

      CRITICAL: Do NOT combine a knowledge base answer with a "I don't have information" statement. Pick one or the other based on what the knowledge_search tool returned.

      CRITICAL: Do NOT add any information from your own training data. Do NOT supplement, fill gaps, or provide "general steps" from your own knowledge.

      CRITICAL: Do NOT include tool call syntax like [knowledge_search(...)] in your response.

      CRITICAL: Never announce what you need to do or are going to do, just do it.

      CRITICAL: Do NOT share your internal thinking. Speak directly and professionally. Do NOT repeat your introduction.

      Answer the user using only what the knowledge_search tool returned.

      When calling a tool, use the built-in function calling mechanism. Do not write the tool call as JSON text in your response.
    transitions:
      success: "waiting_for_follow_up"

  # Waiting state: wait for the user's follow-up response
  waiting_for_follow_up:
    type: "waiting"
    transitions:
      user_input: "classify_follow_up_intent"

  # Classify the user's follow-up intent
  classify_follow_up_intent:
    type: "intent_classifier"
    temperature: 0.2
    uses_tools: "No"
    failure_transition: "waiting_for_follow_up"
    intent_prompt: |
      Analyze the user's message and determine their intent. The user said: "{user_input}"

      Classify their intent as one of the following:
      1. ESCALATE - User is explicitly requesting to escalate the ticket for human review. They must use words like "escalate", "human agent", "speak to someone", "manager", or "supervisor". Simply asking for help, requesting to try a troubleshooting step, or expressing frustration is NOT an escalation request — classify as QUESTION.
      2. CLOSE - User is explicitly requesting to close the ticket using words like "close", "resolved", "done", "cancel", "never mind". Statements like "I'll try that", "thanks for the help", "let me check", "I'll restart", "I'll do that" are NOT close requests — classify as QUESTION.
      3. QUESTION - User has a follow-up question, needs more help, is acknowledging advice ("I'll try that", "thanks", "let me check"), is asking about a specific troubleshooting step ("can I try X?", "should I do Y?", "can I just re-enroll?"), or is asking whether they should escalate/close rather than actually requesting it.

      Respond with only the classification: ESCALATE, CLOSE, or QUESTION
    intent_actions:
      ESCALATE:
        data_storage:
          ticket_action: "escalated"
        next_state: "escalate_ticket"
      CLOSE:
        data_storage:
          ticket_action: "closed"
        next_state: "close_ticket"
      QUESTION:
        next_state: "answer_follow_up"

  # State: Escalate ticket in Zammad then end
  escalate_ticket:
    type: "llm_processor"
    temperature: 0.1
    allowed_tools: ["route_to_human_managed_queue"]
    failure_transition: "end"
    prompt: |
      Call the route_to_human_managed_queue tool, then reply with ONLY this exact text and nothing else:
      Your ticket has been escalated for human review. ticket_escalated
    response_analysis:
      conditions:
        - name: "ticket_escalated"
          trigger_phrases: ["ticket_escalated"]
          actions:
            - type: "transition"
              target: "end"
      default_transition: "end"

  # State: Close ticket in Zammad then end
  close_ticket:
    type: "llm_processor"
    temperature: 0.1
    allowed_tools: ["close"]
    failure_transition: "end"
    prompt: |
      Call the close tool, then reply with ONLY this exact text and nothing else:
      Your ticket has been closed. ticket_closed
    response_analysis:
      conditions:
        - name: "ticket_closed"
          trigger_phrases: ["ticket_closed"]
          actions:
            - type: "transition"
              target: "end"
      default_transition: "end"

  # End state
  end:
    type: "terminal"
    reset_behavior:
      reset_state: "waiting_for_interaction"
      clear_data:
        # System fields
        - "messages"
        - "current_state"
        # Business logic fields
        - "ticket_action"
        # Internal state tracking
        - "_last_waiting_node"
        - "_last_processed_human_count"
        - "_consumed_this_invoke"
